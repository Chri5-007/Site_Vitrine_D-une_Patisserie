        <!-- COMMANDE SECTION -->
    
                    <section class="py-5" style="background: linear-gradient(135deg, #e69451 0%, #f0f7f9 100%); min-height: 100vh;">
            <div class="container">
            <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                <h2 class="text-center mb-5 fw-bold display-5" style="color: #edeceb">📋 Commande</h2>

                <div class="card bg-secondary rounded-4">
                <div class="card-body p-5" style="background-color: #f5dbbe;border-radius: 20px;">
                    <form id="orderForm">
                    <!-- Nom -->
                    <div class="mb-4">
                        <label class="form-label fw-bold" style="color: #e87f07">Nom *</label>
                        <input type="text" class="form-control bg-dark text-light border-warning" id="name" placeholder="Votre nom complet" required />
                    </div>

                    <!-- Téléphone -->
                    <div class="mb-4">
                        <label class="form-label fw-bold" style="color: #e87f07">Téléphone *</label>
                        <input type="tel" class="form-control bg-dark text-light border-warning" id="phone" placeholder="+225 XX XX XX XX" required />
                    </div>

                    <!-- Adresse -->
                    <div class="mb-4">
                        <label class="form-label fw-bold" style="color: #e87f07">Adresse *</label>
                        <textarea class="form-control bg-dark text-light border-warning" id="address" rows="3" placeholder="Adresse de livraison" required></textarea>
                    </div>

                    <!-- Produit -->
                    <div class="mb-4">
                        <label class="form-label fw-bold" style="color: #e87f07">Produit *</label>
                        <select class="form-select bg-dark text-light border-warning" id="product" required>
                        <option value="">-- Sélectionner un produit --</option>
                        <option value="🍰 Mille-Feuille Doré - 15 000 FCFA">🍰 Mille-Feuille Doré - 15 000 FCFA</option>
                        <option value="🌙 Éclairs Nocturnes - 12 000 FCFA">🌙 Éclairs Nocturnes - 12 000 FCFA</option>
                        <option value="✨ Tartelette Rêverie - 10 000 FCFA">✨ Tartelette Rêverie - 10 000 FCFA</option>
                        <option value="🎂 Croquembouche Royal - 28 000 FCFA">🎂 Croquembouche Royal - 28 000 FCFA</option>
                        <option value="👑 Entremet Suprême - 35 000 FCFA">👑 Entremet Suprême - 35 000 FCFA</option>
                        <option value="💎 Paris-Brest Prestige - 31 000 FCFA">💎 Paris-Brest Prestige - 31 000 FCFA</option>
                        </select>
                    </div>

                    <!-- Quantité -->
                    <div class="mb-4">
                        <label class="form-label fw-bold" style="color: #e87f07">Quantité *</label>
                        <input type="number" class="form-control bg-dark text-light border-warning" id="quantity" value="1" min="1" required />
                    </div>

                    <!-- Bouton -->
                    <button type="submit" class="btn w-100 fw-bold fs-5" style="background-color: #e87f07; color: white; border: none; border-radius: 25px;">
                        COMMANDER
                    </button>
                    </form>
                </div>
                </div>
            </div>
            </div>
